  ${o.inMemo?`<div class=mine><b>내 메모 · 손님에게는 안 보여요</b>${esc(o.inMemo)}</div>`:""}
  <div class=acts style="margin-top:16px"><button class="b1 full" onclick="shareImg()">견적서 이미지로 보내기 (카톡·문자)</button>
  <button class="b2 full" onclick="setPaid()">${o.paid?"잔금 받음 취소":"잔금 받았어요 ("+won(b)+")"}</button>
  <button class=b2 onclick="saveImg()">이미지 저장</button><button class=b2 onclick="shareTxt()">글로 보내기</button>
  ${o.phone?`<button class=b2 onclick="location.href='tel:${esc(o.phone)}'">전화 걸기</button>`:`<span></span>`}<button class=b2 onclick="edit()">수정</button>
  <button id=delb class="b3 full" onclick="del()">삭제</button></div></div>`;
}
function priceCard(){
  const tb=(a,u)=>`<table>${a.map((t,i)=>`<tr><td>${tl(a,i,u)}</td><td>${won(t.p)}</td></tr>`).join("")}</table>`;
  return `<div id=pc class=rc><div class=rcI>${emb}<div class=shop>${SHOP}</div><div class=shk>${SHOPK}</div><div class=sub>추가 작업 가격 안내</div>
  <h4 class=ph>이니셜 박 (글자 수 기준)</h4>${tb(PR.ini,"글자")}<p class=pn>공백과 점(.)은 글자 수에 넣지 않아요</p>
  <h4 class=ph>손바느질 (바느질 길이 기준)</h4>${tb(PR.st,"cm")}
  <p class=thx>이용해 주셔서 감사합니다.</p></div></div>`}
function price(){return `<div class=pg><button class=b2 style="margin-top:0" onclick="go('list')">← 목록으로</button>
  <h2 class=ttl style="margin-top:14px">가격 기준표</h2>${priceCard()}
  <button class="b1" onclick="shareP()">손님께 이미지로 보내기</button><button class=b2 onclick="go('pedit')">가격 기준 수정</button></div>`}
function pedit(){
  const tr=(a,u,t)=>a.map((r,i)=>{const last=i==a.length-1,st=i?a[i-1].m+1:1;
    return `<div class=row><span class=pl>${last?st+u+" 이상":st+"~"}</span>${last?"":`<input class=in type=number inputmode=numeric data-a=${t} data-i=${i} data-f=m value="${r.m}"><span class=pl>${u}까지</span>`}<input class=in type=number inputmode=numeric data-a=${t} data-i=${i} data-f=p value="${r.p}"><span class=pl>원</span></div>`}).join("");
  return `<div class=pg><h2 class=ttl>가격 기준 수정</h2>
  <div class=bx><h3>이니셜 박 (글자 수)</h3>${tr(PR.ini,"글자","ini")}</div>
  <div class=bx><h3>손바느질 (cm)</h3>${tr(PR.st,"cm","st")}</div></div>
  <div class=bar><button class=b2 onclick="go('price')">취소</button><button class=b1 onclick="savePr()">저장</button></div>`}
Object.assign(window,{
  setAuto:(k,n,p)=>{const w=$("#its");let r=w.querySelector(`[data-k=${k}]`);
    if(!p){r?.remove();return calc()}
    if(!r){r=[...w.children].find(e=>!e.dataset.k&&!e.children[0].value&&!e.children[1].value);
      if(r)r.dataset.k=k;else{w.insertAdjacentHTML("beforeend",itRow({n,p,k}));r=w.lastElementChild}}
    r.children[0].value=n;r.children[1].value=p;calc()},
  hints:()=>{const n=nch($("#fi").value),c=+$("#fs").value||0;
    $("#hi").textContent=n?`${n}글자 → ${won(tp(PR.ini,n))}`:"공백과 점(.)은 글자 수에 넣지 않아요";
    $("#hs").textContent=c>0?`${c}cm → ${won(tp(PR.st,c))}`:"";vdHint()},
  autoIni:()=>{const a=$("#fi").value.trim(),n=nch(a);setAuto("ini",`이니셜 박 (${a}, ${n}글자)`,n?tp(PR.ini,n):0);hints()},
  autoSt:()=>{const c=+$("#fs").value||0;setAuto("st",`손바느질 (${c}cm)`,c>0?tp(PR.st,c):0);hints()},
  savePr:()=>{const n=JSON.parse(JSON.stringify(PR));
    document.querySelectorAll("[data-a]").forEach(e=>{const f=e.dataset.f;n[e.dataset.a][+e.dataset.i][f]=+e.value||0});
    for(const a of["ini","st"])for(let i=1;i<n[a].length-1;i++)if(n[a][i].m<=n[a][i-1].m)return toast("숫자는 위 칸보다 커야 해요.");
    PR=n;try{localStorage.setItem("leatherPrice",JSON.stringify(PR))}catch(e){}
    go("price");toast("저장했어요")},
  shareP:async()=>{toast("이미지를 만드는 중...");
    const c=await html2canvas($("#pc"),{scale:2,backgroundColor:"#ece7de"});
    c.toBlob(async b=>{const f=new File([b],"가격안내.png",{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}
      else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;a.click();toast("이미지가 저장됐어요.")}})},
  startDemo:()=>{demo=true;user={};orders=sample();api=demoApi;view="list";cur=null;render()},
  login:()=>{if(!auth)return toast("연결 중이에요. 잠시 후 다시 눌러주세요.");fb.signInWithPopup(auth,new fb.GoogleAuthProvider()).catch(e=>toast("로그인 실패: "+e.code))},
  logout:()=>{if(demo){demo=false;user=null;orders=[];view="list";cur=null;render()}else fb.signOut(auth)},
  go:v=>{view=v;render();scrollTo(0,0)},
  setF:s=>{filter=s;render()},
  setQ:v=>{q=v.trim();$("#lst").innerHTML=cards()},
  open_:id=>{cur=orders.find(o=>o.id==id);view="detail";if(cur&&!cur.qno){const n=nextQno(qd(cur)||today());cur.qno=n;try{Promise.resolve(api.upd(cur.id,{qno:n})).catch(()=>{})}catch(e){}}render();scrollTo(0,0)},
  newOrder:()=>{cur=null;view="form";render();scrollTo(0,0)},
  edit:()=>{view="form";render();scrollTo(0,0)},
  addIt:()=>{$("#its").insertAdjacentHTML("beforeend",itRow({n:"",p:""}));$("#its").lastElementChild.firstChild.focus()},
  addQ:n=>{const w=$("#its");let r=[...w.children].find(e=>!e.dataset.k&&!e.children[0].value&&!e.children[1].value);
    if(!r){w.insertAdjacentHTML("beforeend",itRow({n:"",p:""}));r=w.lastElementChild}
    r.children[0].value=n;r.children[1].focus();calc()},
  setTy:t=>{ty=t;document.querySelectorAll("#tys .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==t));$("#wbx").innerHTML=wInner(t,cur&&cur.type==t?cur.wsz||{}:{})},
  calc:()=>{let t=0;document.querySelectorAll("#its .row").forEach(r=>{const u=+r.children[1].value||0,q=+r.children[2].value||1,p=Math.round(u*q);t+=p;r.querySelector(".lt").textContent=q!=1&&u?`${won(u)} × ${q} = ${won(p)}`:""});
    const e=[...document.querySelectorAll("#exs .ip")].reduce((a,x)=>a+(+x.value||0),0),v=+$("#fdc").value||0,c=Math.min(S.dm=="pct"?Math.round(t*Math.min(v,100)/100):v,t),d=+$("#fd").value||0,tot=t-c+e;
    $("#hdc").textContent=S.dm=="pct"&&v?`소계의 ${v}% = ${won(c)}`:"";
    $("#tot").innerHTML=((c||e)?`<span>소계</span><b>${won(t)}</b>`:"")+(c?`<span>${esc($("#fdn").value.trim()||"할인")}</span><b>-${won(c)}</b>`:"")+(e?`<span>추가 비용</span><b>+${won(e)}</b>`:"")+`<span>합계</span><b class=big>${won(tot)}</b>`+(d?`<span>선수금</span><b>-${won(d)}</b>`:"")+`<span>잔금</span><b>${won(tot-d)}</b>`},
  setQs:v=>{S.qs=v;document.querySelectorAll("#g_qs .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==v))},
  setDm:k=>{S.dm=k;document.querySelectorAll("#g_dm .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==k));calc()},
  addEx:n=>{const w=$("#exs");w.insertAdjacentHTML("beforeend",exRow({n,p:""}));w.lastElementChild.children[n?1:0].focus()},
  qChg:()=>{const e=$("#fqn");if(e.dataset.auto)e.value=nextQno($("#fq").value||today());vdHint()},
  vdChg:v=>{S.vd=+v||0;document.querySelectorAll("#g_vd .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==S.vd));vdHint()},
  vdHint:()=>{const e=$("#hv");if(!e)return;const q=$("#fq").value,n=+S.vd;e.textContent=q&&n>0?`${q} 부터 ${addD(q,n)}까지 유효해요`:""},
  setS:(k,v)=>{S[k]=v;document.querySelectorAll("#g_"+k+" .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==v));const m={lt:["fl","기타"],th:["fth","직접 입력"],ln:["fln","기타"]}[k];$("#"+m[0]).classList.toggle("hid",v!=m[1])},
  setVd:n=>{S.vd=n;document.querySelectorAll("#g_vd .chip").forEach(c=>c.classList.toggle("on",c.dataset.t==n));$("#fvd").value=n;vdHint()},
  setSt:s=>api.upd(cur.id,{status:s}).then(()=>{if(demo)render()}),
  setPaid:()=>api.upd(cur.id,{paid:!cur.paid}).then(()=>{if(demo)render()}),
  save:async()=>{
    const name=$("#fn").value.trim();if(!name)return toast("손님 이름을 적어주세요.");
    const items=[...document.querySelectorAll("#its .row")].map(r=>{const u=+r.children[1].value||0,q=+r.children[2].value||1,m={n:r.children[0].value.trim(),p:Math.round(u*q)};if(q!=1){m.q=q;m.u=u}if(r.dataset.k)m.k=r.dataset.k;return m}).filter(i=>i.n||i.p);
    const extras=[...document.querySelectorAll("#exs .row")].map(r=>({n:r.children[0].value.trim(),p:+r.children[1].value||0})).filter(i=>i.n||i.p);
    const tI=items.reduce((a,i)=>a+i.p,0),dv0=+$("#fdc").value||0,pct=S.dm=="pct"?Math.min(dv0,100):0,discAmt=Math.min(S.dm=="pct"?Math.round(tI*pct/100):dv0,tI),qdt=$("#fq").value,qno=$("#fqn").dataset.auto?nextQno(qdt||today()):($("#fqn").value.trim()||nextQno(qdt||today()));
    const data={name,phone:$("#fp").value.trim(),type:ty,leather:S.lt=="기타"?$("#fl").value.trim():S.lt,color:$("#fc").value.trim(),thread:S.th==T[0]?"동일":$("#fth").value.trim(),liningType:S.ln=="기타"?$("#fln").value.trim():S.ln,lining:$("#fli").value.trim(),memo:$("#fm").value.trim(),items,ext:{ini:$("#fi").value.trim(),cm:+$("#fs").value||0},deposit:+$("#fd").value||0,disc:discAmt,discName:$("#fdn").value.trim(),hideSpec:!S.qs,discPct:pct,extras,qno,size:$("#fsz").value.trim(),wsz:Object.fromEntries(wf(ty).map(z=>[z[0],$("#fw"+z[0]).value.trim()]).filter(x=>x[1])),parts:$("#fpt").value.trim(),engr:$("#feg").value.trim(),qdate:$("#fq").value,vdays:S.vd||14,note:$("#fnote").value.trim(),inMemo:$("#fim").value.trim(),received:$("#fr").value,due:$("#fe").value};
    try{
      if(cur?.id){await api.set(cur.id,data);cur={...cur,...data}}
      else{const id=await api.add(data);cur={id,...data,status:"접수"}}
      view="detail";render();scrollTo(0,0);toast("저장했어요");
    }catch(e){toast("저장 실패: "+(e.code||e.message))}
  },
  del:async()=>{const b=$("#delb");
    if(!b.dataset.s){b.dataset.s=1;b.textContent="한 번 더 누르면 삭제돼요";setTimeout(()=>{if(b.isConnected){b.dataset.s="";b.textContent="삭제"}},3000);return}
    await api.del(cur.id);cur=null;view="list";render();toast("삭제했어요")},
  imgBlob:async()=>{toast("이미지를 만드는 중...");const c=await html2canvas($("#rc"),{scale:2,backgroundColor:"#ece7de"});return new Promise(r=>c.toBlob(r))},
  fname:()=>cur.name+"_견적서.png",
  dlImg:(b,n)=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();toast("이미지가 저장됐어요. 카톡에서 사진으로 보내세요.")},
  shareImg:async()=>{try{const b=await imgBlob(),f=new File([b],fname(),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else dlImg(b,f.name)}catch(e){toast("이미지를 만들지 못했어요.")}},
  saveImg:async()=>{try{dlImg(await imgBlob(),fname())}catch(e){toast("이미지를 만들지 못했어요.")}},
  shareTxt:async()=>{
    const t=text(cur);
    if(navigator.share){try{await navigator.share({text:t})}catch(e){}}
    else location.href="sms:"+(cur.phone||"")+"?body="+encodeURIComponent(t);
  }
});
render();
if(live)initLive();
</script></body></html>
